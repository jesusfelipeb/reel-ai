name: Imagen Docker

# Construye la imagen para Intel/AMD (amd64) y ARM (arm64: Mac con chip M, Raspberry Pi),
# la prueba renderizando capturas reales en las dos, y solo entonces la publica en
# ghcr.io/<dueño>/reel-ai.
#
#   - Tag vX.Y.Z  -> publica :X.Y.Z y :latest
#   - Run workflow manual o PR que toca la imagen -> construye y prueba, no publica

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "package*.json", "requirements.txt", "reel.py", "motion/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # arm64 se construye emulado: mas lento, pero no depende del plan de la cuenta.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construir y probar (amd64 y arm64)
        run: |
          set -eu
          mkdir -p prueba
          for plat in linux/amd64 linux/arm64; do
            tag="reel-ai:test-${plat#linux/}"
            docker buildx build --platform "$plat" --load -t "$tag" \
              --cache-from type=gha,scope="$plat" --cache-to type=gha,mode=max,scope="$plat" .
            docker run --rm --platform "$plat" "$tag" doctor
            # Captura real con Chromium + validacion: si la imagen esta rota, falla aca.
            docker run --rm --platform "$plat" --user "$(id -u):$(id -g)" -v "$PWD/prueba:/work" "$tag" \
              stills /app/examples/diagnostico-gratis-reel-test.json --at 3,22 --json
            test "$(find prueba/output/stills -name 'still-*.png' | wc -l)" -ge 2
            rm -rf prueba/output
          done

      - name: Etiquetas
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reel-ai
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Login a GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
